<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>สั่งอาหาร · Akara Canteen</title>
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --navy: #1d4a8f; --navy-2: #2a5daa; --gold: #fcc934; --ink: #14203a; --ink-2: #4a5874; --ink-3: #7d889e; --line: #E3E8F0; --bg: #F2F5FA; --red: #C2362B; --em: #0f9d6e; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "IBM Plex Sans Thai", system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; }
.top { background: linear-gradient(120deg, var(--navy), var(--navy-2) 70%, #3a6fc0); color: #fff; padding: 18px 16px 70px; box-shadow: inset 0 -6px 0 var(--gold); }
.top .in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.top img { height: 36px; background: #fff; border-radius: 10px; padding: 4px 8px; }
.top h1 { margin: 0; font-size: 19px; } .top p { margin: 0; font-size: 13.5px; color: #dbe6f8; }
.wrap { max-width: 760px; margin: -50px auto 120px; padding: 0 14px; display: grid; gap: 14px; }
.card { background: #fff; border-radius: 18px; box-shadow: 0 10px 30px -14px rgba(16,32,70,.3); overflow: hidden; }
.days { display: flex; gap: 8px; overflow-x: auto; padding: 14px; scrollbar-width: none; }
.day { flex: none; width: 74px; border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 6px; text-align: center; background: #fff; cursor: pointer; font: inherit; color: var(--ink); }
.day small { display: block; font-size: 11.5px; color: var(--ink-3); } .day b { display: block; font-size: 20px; line-height: 1.1; }
.day i { display: block; font-style: normal; font-size: 11px; color: var(--em); font-weight: 600; min-height: 16px; }
.day.on { border-color: var(--navy); background: #EAF1FC; } .day.today small { color: var(--navy); font-weight: 700; }
.menu { padding: 14px 16px; display: grid; gap: 8px; border-top: 1px solid var(--line); }
.menu div { display: flex; gap: 10px; } .menu span { flex: none; font-size: 12.5px; font-weight: 600; color: var(--ink-3); width: 78px; padding-top: 1px; }
.tabs { display: flex; gap: 6px; padding: 12px 14px 0; flex-wrap: wrap; }
.tab { border: 0; background: #EEF2F8; border-radius: 12px; padding: 8px 14px; font: inherit; font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.tab.on { background: var(--navy); color: #fff; } .tab em { font-style: normal; font-weight: 500; opacity: .8; font-size: 12.5px; }
.st { margin: 12px 14px 0; font-size: 13px; padding: 8px 12px; border-radius: 10px; background: #E9F7F1; color: #0b6b4c; }
.st.closed { background: #FDECEA; color: var(--red); }
.add { display: flex; gap: 8px; padding: 12px 14px; } .add input { flex: 1; }
input, select { height: 44px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; font: inherit; font-size: 15px; background: #fff; min-width: 0; }
input:focus { outline: none; border-color: var(--navy); }
.btn { height: 44px; padding: 0 16px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn-p { background: var(--navy); color: #fff; border-color: var(--navy); } .btn-g { background: var(--gold); border-color: var(--gold); color: #3b2a00; }
.btn:disabled { opacity: .5; cursor: default; }
.list { padding: 0 14px 6px; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); }
.row .n { width: 26px; color: var(--ink-3); font-size: 13px; text-align: right; flex: none; }
.row .nm { flex: 1; min-width: 0; } .row .nm small { display: block; color: var(--ink-3); font-size: 12px; }
.row input.q { width: 64px; height: 36px; text-align: center; } .row .x { border: 0; background: none; color: var(--ink-3); font-size: 20px; cursor: pointer; width: 34px; height: 34px; }
.empty { padding: 26px 14px; text-align: center; color: var(--ink-3); }
.tools { display: flex; gap: 8px; padding: 6px 14px 14px; flex-wrap: wrap; } .tools .btn { height: 36px; font-size: 13px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -8px 24px -12px rgba(16,32,70,.25); }
.bar .in { max-width: 760px; margin: 0 auto; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: center; }
.bar .t { flex: 1; min-width: 0; } .bar .t b { font-size: 20px; } .bar .t small { display: block; color: var(--ink-3); font-size: 12px; }
.bar input { width: 150px; }
.toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: #14203a; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 9; }
.toast.err { background: var(--red); }
.msg { text-align: center; padding: 40px 20px; }
@media (max-width: 520px) { .bar input { width: 110px; } }
</style>
</head>
<body>

<div class="wrap" id="wrap"><div class="card msg">กำลังโหลด…</div></div>

  <input id="by" placeholder="ชื่อผู้สั่ง" autocomplete="name"><button class="btn btn-p" id="save">บันทึก</button></div></div>

</html>
