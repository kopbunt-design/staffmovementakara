<div class="fx-shell">

    </div>

      <div class="grp">โรงอาหาร</div>
      <a href="#/day" data-r="day"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M8 14h3v3H8z"/></svg>รายวัน · ใบแจ้งยอด</a>
