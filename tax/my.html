<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>50 ทวิ ของฉัน · Akara Resources</title>
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --navy: #0A1A33; --navy-2: #17386A; --em: #10A877; --ink: #0E1A2B; --ink-2: #44526A; --ink-3: #7A869A; --line: #E3E8F0; --bg: #F3F5F9; --red: #C2362B; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "IBM Plex Sans Thai", system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.55; }
.top { background: radial-gradient(100% 120% at 100% 0%, rgba(16,168,119,.28), transparent 60%), var(--navy); color: #fff; padding: 28px 16px 70px; text-align: center; }
.top img { height: 40px; background: #fff; border-radius: 10px; padding: 4px 8px; }
.top h1 { margin: 14px 0 4px; font-size: 22px; } .top p { margin: 0; color: #B9C7DD; font-size: 14px; }
.box { max-width: 460px; margin: -48px auto 30px; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px -12px rgba(10,26,51,.25); padding: 24px 22px; }
label { display: block; margin-bottom: 14px; } label span { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 5px; font-weight: 600; }
input { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; letter-spacing: .04em; }
input:focus { outline: 2px solid rgba(23,56,106,.25); border-color: var(--navy-2); }
button { width: 100%; height: 48px; border: 0; border-radius: 12px; background: linear-gradient(180deg, var(--navy-2), var(--navy)); color: #fff; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
button:disabled { opacity: .6; }
.msg { margin-top: 12px; color: var(--red); font-size: 14px; min-height: 1em; }
.note { margin-top: 16px; font-size: 12.5px; color: var(--ink-3); }
.cert { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.cert:last-child { border-bottom: 0; } .cert b { font-size: 16px; } .cert small { display: block; color: var(--ink-3); }
.cert button { width: auto; height: 40px; padding: 0 16px; font-size: 14px; }
.hi { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
</style>
</head>
<body>
<!-- หน้าพนักงานโหลด 50 ทวิ ของตัวเอง (ไม่ต้อง login) — tax/my.js → rpc tax_my_certs (azure-app/tax.py) · user 2026-11-13 -->
<div class="top"><img src="/assets/logo.png" alt="Akara"><h1>หนังสือรับรองการหักภาษี ณ ที่จ่าย (50 ทวิ)</h1><p>สำหรับพนักงาน บริษัท อัครา รีซอร์สเซส จำกัด (มหาชน)</p></div>
<div class="box" id="box">
  <form id="f">
    <label><span>รหัสพนักงาน</span><input id="code" autocomplete="username" placeholder="AKR…" required></label>
    <label><span>เลขประจำตัวประชาชน 13 หลัก</span><input id="tid" inputmode="numeric" maxlength="17" placeholder="x-xxxx-xxxxx-xx-x" autocomplete="off" required></label>
    <button id="go">ดู 50 ทวิ ของฉัน</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="note">ใช้เลขเดียวกับที่บริษัทยื่นภาษีให้คุณ · ใส่ผิดหลายครั้งระบบจะล็อกชั่วคราว 30 นาที · ถ้าเข้าไม่ได้ติดต่อฝ่ายบุคคล</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="/tax/my.js?v=1"></script>
</body>
</html>
