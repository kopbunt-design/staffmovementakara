.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 640px; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--ink-2); background: #F7F9FC; padding: 9px 12px; }

textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; resize: vertical; }
